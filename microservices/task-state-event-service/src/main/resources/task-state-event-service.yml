resourceConfig: org.radarbase.appserver.microservices.task_state_event.enhancer.factory.TaskStateEventServiceResourceEnhancerFactory

server:
  baseUri: http://taskstate-service:9014
  requestTimeout: 30
  isJmxEnabled: false

db:
  # For Development environment, use H2 database.
  jdbcDriver: org.h2.Driver
  jdbcUrl: jdbc:h2:mem:appserver_task_state_event
  hibernateDialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  additionalProperties:
    jakarta.persistence.schema-generation.database.action: drop-and-create
    hibernate.show_sql: true
    hibernate.format_sql: true
#  jdbcDriver: org.postgresql.Driver
#  jdbcUrl: jdbc:postgresql://localhost:5432/appserver_task_state_event
#  hibernateDialect: org.hibernate.dialect.PostgreSQLDialect
#  username: radar
#  password: radar

eventBus:
  numThreads: 3
