networks:
  public:
    driver: bridge
  mp:
    driver: bridge
    internal: true
  mp-db:
    driver: bridge
    internal: true
  microservice:
    driver: bridge
    internal: true
  project-service-internal:
    driver: bridge
    internal: true
  user-service-internal:
    driver: bridge
    internal: true
  task-service-internal:
    driver: bridge
    internal: true
  cloud-messaging-service-internal:
    driver: bridge
    internal: true

services:
  #---------------------------------------------------------------------------#
  # ManagementPortal Postgres                                                 #
  #---------------------------------------------------------------------------#
  managementportal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: radarbase
      POSTGRES_PASSWORD: radarbase
      POSTGRES_DB: managementportal
    networks:
      - mp-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radarbase -d managementportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  #---------------------------------------------------------------------------#
  # Management Portal                                                         #
  #---------------------------------------------------------------------------#
  managementportal:
    image: radarbase/management-portal:2.1.0
    depends_on:
      managementportal-postgresql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://managementportal-postgresql:5432/managementportal
      SPRING_DATASOURCE_USERNAME: radarbase
      SPRING_DATASOURCE_PASSWORD: radarbase
      SPRING_LIQUIBASE_CONTEXTS: dev
      JHIPSTER_SLEEP: 10
      JAVA_OPTS: -Xmx512m
      MANAGEMENTPORTAL_COMMON_BASE_URL: http://localhost:8081/managementportal
      MANAGEMENTPORTAL_COMMON_MANAGEMENT_PORTAL_BASE_URL: http://localhost:8081/managementportal
      MANAGEMENTPORTAL_FRONTEND_CLIENT_SECRET:
      MANAGEMENTPORTAL_OAUTH_CLIENTS_FILE: /mp-includes/config/oauth_client_details.csv
    networks:
      - public
      - mp
      - mp-db
    ports:
      - "8081:8081"
    volumes:
      - ./integration-tests/src/integrationTest/resources/docker/etc/:/mp-includes/

  #---------------------------------------------------------------------------#
  # Project Service                                                           #
  #---------------------------------------------------------------------------#
  project-service-db:
    image: postgres:16
    networks:
      - project-service-internal
    environment:
      POSTGRES_DB: appserver_project
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d appserver_project"]
      interval: 5s
      timeout: 5s
      retries: 5

  project-service:
    build:
      context: ..
      dockerfile: microservices/project-service/Dockerfile
    image: radarbase/appserver-project-service:SNAPSHOT
    networks:
      - microservice
      - project-service-internal
    depends_on:
      project-service-db:
        condition: service_healthy
    environment:
      APPSERVER_PROJECT_JDBC_URL: jdbc:postgresql://project-service-db:5432/appserver_project
      APPSERVER_PROJECT_JDBC_USERNAME: radar
      APPSERVER_PROJECT_JDBC_PASSWORD: radar
      APPSERVER_PROJECT_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      APPSERVER_PROJECT_JDBC_DRIVER: org.postgresql.Driver

  #---------------------------------------------------------------------------#
  # User Service                                                              #
  #---------------------------------------------------------------------------#
  user-service-db:
    image: postgres:16
    networks:
      - user-service-internal
    environment:
      POSTGRES_DB: appserver_user
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d appserver_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ..
      dockerfile: microservices/user-service/Dockerfile
    image: radarbase/appserver-user-service:SNAPSHOT
    networks:
      - microservice
      - user-service-internal
    depends_on:
      user-service-db:
        condition: service_healthy
    environment:
      APPSERVER_USER_JDBC_URL: jdbc:postgresql://user-service-db:5432/appserver_user
      APPSERVER_USER_JDBC_USERNAME: radar
      APPSERVER_USER_JDBC_PASSWORD: radar
      APPSERVER_USER_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      APPSERVER_USER_JDBC_DRIVER: org.postgresql.Driver
      APPSERVER_PROJECT_SERVICE_BASE_URL: http://project-service:9010

  #---------------------------------------------------------------------------#
  # Github Service                                                            #
  #---------------------------------------------------------------------------#
  github-service:
    build:
      context: ..
      dockerfile: microservices/github-service/Dockerfile
    image: radarbase/appserver-github-service:SNAPSHOT
    networks:
      - microservice
      - public

  #---------------------------------------------------------------------------#
  # Protocol Service                                                          #
  #---------------------------------------------------------------------------#
  protocol-service:
    build:
      context: ..
      dockerfile: microservices/protocol-service/Dockerfile
    image: radarbase/appserver-protocol-service:SNAPSHOT
    networks:
      - microservice
    environment:
      APPSERVER_GITHUB_SERVICE_BASE_URL: http://github-service:9011

  #---------------------------------------------------------------------------#
  # Task Service                                                              #
  #---------------------------------------------------------------------------#
  task-service-db:
    image: postgres:16
    networks:
      - task-service-internal
    environment:
      POSTGRES_DB: appserver_task
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d appserver_task"]
      interval: 5s
      timeout: 5s
      retries: 5

  task-service:
    build:
      context: ..
      dockerfile: microservices/task-service/Dockerfile
    image: radarbase/appserver-task-service:SNAPSHOT
    networks:
      - microservice
      - task-service-internal
    depends_on:
      task-service-db:
        condition: service_healthy
    environment:
      APPSERVER_TASK_JDBC_URL: jdbc:postgresql://task-service-db:5432/appserver_task
      APPSERVER_TASK_JDBC_USERNAME: radar
      APPSERVER_TASK_JDBC_PASSWORD: radar
      APPSERVER_TASK_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      APPSERVER_TASK_JDBC_DRIVER: org.postgresql.Driver

  #---------------------------------------------------------------------------#
  # Cloud Messaging Service                                                   #
  #---------------------------------------------------------------------------#
  cloud-messaging-service-db:
    image: postgres:16
    networks:
      - cloud-messaging-service-internal
    environment:
      POSTGRES_DB: appserver_cloud_messaging
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d appserver_cloud_messaging"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloud-messaging-service:
    build:
      context: ..
      dockerfile: microservices/cloud-messaging-service/Dockerfile
    image: radarbase/appserver-cloud-messaging-service:SNAPSHOT
    networks:
      - microservice
      - cloud-messaging-service-internal
    depends_on:
      cloud-messaging-service-db:
        condition: service_healthy
    environment:
      APPSERVER_CLOUD_MESSAGING_JDBC_URL: jdbc:postgresql://cloud-messaging-service-db:5432/appserver_cloud_messaging
      APPSERVER_CLOUD_MESSAGING_JDBC_USERNAME: radar
      APPSERVER_CLOUD_MESSAGING_JDBC_PASSWORD: radar
      APPSERVER_CLOUD_MESSAGING_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      APPSERVER_CLOUD_MESSAGING_JDBC_DRIVER: org.postgresql.Driver
      GOOGLE_APPLICATION_CREDENTIALS: /appserver-includes/google-credentials.json
    volumes:
      - ./integration-tests/src/integrationTest/resources/docker/fcm:/appserver-includes/

  #---------------------------------------------------------------------------#
  # Gateway Service                                                           #
  #---------------------------------------------------------------------------#
  gateway-service:
    build:
      context: ../
      dockerfile: microservices/gateway-service/Dockerfile
    image: radarbase/appserver-gateway-service:SNAPSHOT
    ports:
      - "8080:8080"
    networks:
      - public
      - microservice
      - mp
    depends_on:
      - project-service
      - user-service
      - github-service
      - protocol-service
      - task-service
      - cloud-messaging-service
    environment:
      APPSERVER_PROJECT_SERVICE_BASE_URL: http://project-service:9010
      APPSERVER_USER_SERVICE_BASE_URL: http://user-service:9013
      APPSERVER_GITHUB_SERVICE_BASE_URL: http://github-service:9011
      APPSERVER_PROTOCOL_SERVICE_BASE_URL: http://protocol-service:9012
      APPSERVER_TASK_SERVICE_BASE_URL: http://task-service:9014
      APPSERVER_CLOUD_MESSAGING_SERVICE_BASE_URL: http://cloud-messaging-service:9015
      APPSERVER_MANAGEMENTPORTAL_BASE_URL: http://managementportal:8081/managementportal
