resourceConfig: org.radarbase.appserver.microservices.project.enhancer.factory.GithubServiceResourceEnhancerFactory

server:
  baseUri: http://0.0.0.0:9012/github
  requestTimeout: 30
  isJmxEnabled: false

  # GitHub configuration.
  github:
    # GitHub Cache configuration.
    cache:
      # Duration in seconds for which the cache is valid.
      cacheDurationSec: 3600
      # Duration in seconds after which the cache can be refreshed.
      retryDurationSec: 60
      # Maximum number of entries in the cache.
      maxCacheSize: 10000
      # GitHub HTTP Client configuration.
    client:
      maxContentLength: 1000000
      timeoutSec: 10
      githubToken:
