resourceConfig: org.radarbase.appserver.microservices.gateway.enhancer.factory.GatewayServiceResourceEnhancerFactory

externalPrefix:

auth:
  managementPortalUrl: http://localhost:8081/managementportal
  resourceName: res_AppServer

routes:
  - name: project
    path: projects
    baseUrl: http://project-service:9010
  - name: user
    path:
    baseUrl: http://user-service:9013
  - name: github
    path: github/content
    baseUrl: http://github-service:9011
  - name: protocol
    path:
    baseUrl: http://protocol-service:9012
  - name: task
    path:
    baseUrl: http://task-service:9014
  - name: messaging
    path:
    baseUrl: http://cloud-messaging-service:9015

server:
  # Base URI of the application.
  baseUri: http://gateway-service:8080
  # Timeout for requests to the application.
  requestTimeout: 30
  isJmxEnabled: false
